<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SM Tour - Login & Registration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #004085;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background-color: #ffffff;
            color: #333;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            color: #004085;
            margin-bottom: 20px;
        }
        .form-group {
            display: none;
        }
        .active-form {
            display: block;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #004085;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button.submit-btn:hover {
            background-color: #003366;
        }
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .toggle-link a {
            color: #004085;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Registration Form -->
    <div id="register-form" class="form-group active-form">
        <h2>Create an account</h2>
        <form onsubmit="event.preventDefault();">
            <input type="text" placeholder="Username" required>
            <input type="email" placeholder="Email" required>
            <input type="tel" placeholder="Phone Number" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="submit-btn">Register</button>
        </form>
        <div class="toggle-link">
            Already have an account? <a href="#" onclick="switchForm('login-form')">Login</a>
        </div>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="form-group">
        <h2>Welcome Back</h2>
        <form onsubmit="event.preventDefault();">
            <input type="text" placeholder="Email or Username" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="submit-btn">Login</button>
        </form>
        <div class="toggle-link">
            Don't have an account? <a href="#" onclick="switchForm('register-form')">Register</a>
        </div>
    </div>
</div>

<script>
    function switchForm(formId) {
        document.getElementById('register-form').classList.remove('active-form');
        document.getElementById('login-form').classList.remove('active-form');
        document.getElementById(formId).classList.add('active-form');
    }
</script>

</body>
</html>
